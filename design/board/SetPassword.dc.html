<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposed set password page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A48A5}a:hover{color:#083A86}
</style>
</helmet>
<div style="min-height: 100%; background: #F6F7F9; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 64px 16px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px">
<img src="/_blob/67291cc5cf75113d16832678d92ee54a" alt="" width="30" height="36" style="display: block">
<span style="font-size: 18px; font-weight: 600">Silverleaf Academy</span>
</div>
<main style="width: 100%; max-width: 440px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 32px 32px 28px 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; color: #067647; background: #ECFDF3; border-radius: 999px; padding: 3px 10px">Approved</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 600">Set your password</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">Your desk is ready. Choose a password to finish.</p>
</div>
<form aria-label="Set your password" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sp-email" style="font-size: 14px; font-weight: 600">Email</label>
<input id="sp-email" name="email" type="email" value="[approved email]" readonly="" aria-describedby="sp-email-hint" style="font: inherit; font-size: 15px; color: #374151; background: #F6F7F9; border: 1px solid #E3E6EB; border-radius: 8px; padding: 11px 12px; min-height: 44px; box-sizing: border-box">
<span id="sp-email-hint" style="font-size: 13px; color: #4B5563">The email the Admin approved. You sign in with it.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sp-new" style="font-size: 14px; font-weight: 600">New password</label>
<div style="display: flex; align-items: stretch; border: 1px solid #D5D9E0; border-radius: 8px; overflow: hidden">
<input id="sp-new" name="newPassword" type="password" autocomplete="new-password" aria-describedby="sp-rules" style="flex: 1 1 auto; min-width: 0; font: inherit; font-size: 15px; border: 0; padding: 11px 12px; min-height: 44px; box-sizing: border-box">
<button type="button" aria-label="Show new password" aria-pressed="false" aria-controls="sp-new" style="flex: 0 0 44px; width: 44px; background: #FFFFFF; border: 0; border-left: 1px solid #E3E6EB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sp-confirm" style="font-size: 14px; font-weight: 600">Type it again</label>
<div style="display: flex; align-items: stretch; border: 1px solid #D5D9E0; border-radius: 8px; overflow: hidden">
<input id="sp-confirm" name="confirmPassword" type="password" autocomplete="new-password" style="flex: 1 1 auto; min-width: 0; font: inherit; font-size: 15px; border: 0; padding: 11px 12px; min-height: 44px; box-sizing: border-box">
<button type="button" aria-label="Show confirm password" aria-pressed="false" aria-controls="sp-confirm" style="flex: 0 0 44px; width: 44px; background: #FFFFFF; border: 0; border-left: 1px solid #E3E6EB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<div id="sp-rules" style="background: #F6F7F9; border: 1px solid #E3E6EB; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Your password</span>
<ul style="margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.45; color: #374151">
<sc-for list="{{rules}}" as="rule" hint-placeholder-count="3">
<li>{{rule}}</li>
</sc-for>
</ul>
</div>
<button type="submit" style="font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0A48A5; border: 0; border-radius: 8px; padding: 12px 18px; min-height: 44px">Save and sign in</button>
</form>
<p style="margin: 0; font-size: 14px; color: #4B5563">Not your email? Ask your Admin before you go on.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":872}}'>
class Component extends DCLogic {
renderVals() {
return {
rules: [
'Use at least 6 characters.',
'Spaces at the start or end are dropped.',
'Both boxes must match.'
]
};
}
}
</script>
</body>
</html>
