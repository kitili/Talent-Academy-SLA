<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposed Fellow lesson quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A48A5}a:hover{color:#083A86}
</style>
</helmet>
<div style="min-height: 100%; background: #F6F7F9; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
<header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="/_blob/67291cc5cf75113d16832678d92ee54a" alt="" width="30" height="36" style="display: block">
<span style="font-size: 16px; font-weight: 600">Silverleaf Academy</span>
<span style="font-size: 12px; font-weight: 600; color: #0A48A5; background: #E8F0FB; border-radius: 999px; padding: 3px 10px">Fellow</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="font: inherit; font-size: 14px; color: #374151; background: none; border: 0; padding: 10px 12px; border-radius: 8px">Help</button>
<button type="button" aria-label="Notifications, 1 unread" style="position: relative; width: 44px; height: 44px; background: none; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; border-radius: 8px; background: #0A48A5; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">1</span></button>
<button type="button" aria-label="Switch to dark mode" style="width: 44px; height: 44px; background: none; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
<span style="font-size: 14px; font-weight: 600; padding: 0 8px">Amina Teacher</span>
<button type="button" style="font: inherit; font-size: 14px; color: #111827; background: #FFFFFF; border: 1px solid #D5D9E0; border-radius: 8px; padding: 9px 14px">Log out</button>
</div>
</header>
<div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
<nav aria-label="Fellow desk" style="flex: 1 1 232px; max-width: 280px; background: #FFFFFF; border-right: 1px solid #E3E6EB; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 15px">
<a href="#home" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Home</a>
<a href="#learning" aria-current="page" style="text-decoration: none; background: #E8F0FB; color: #0A48A5; font-weight: 600; border-radius: 8px; padding: 10px 12px">Learning</a>
<a href="#work" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Work</a>
<a href="#quizzes" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Quizzes</a>
<a href="#progress" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Progress</a>
<a href="#reflect" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Reflect</a>
<a href="#messages" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Messages</a>
<a href="#certificates" style="text-decoration: none; color: #374151; border-radius: 8px; padding: 10px 12px">Certificates</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px 40px; display: flex; flex-direction: column; gap: 22px; max-width: 1120px">
<a href="#module" style="font-size: 14px; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Back to the module</a>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">[Lesson file] quiz</h1>
<span style="font-size: 14px; color: #4B5563">Question 2 of 5 · try 1 of 3 · pass at 80%</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="taking" style="flex: 0 1 640px; min-width: 0; background: #FFFFFF; border: 1px dashed #C9D6EA; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
<p id="taking" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4B5563">Example state · taking the quiz</p>
<div role="progressbar" aria-label="Question 2 of 5" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2" style="display: flex; gap: 6px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
<span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: {{d}}"></span>
</sc-for>
</div>
<fieldset style="margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 0 12px 0; font-size: 17px; font-weight: 600; line-height: 1.4">2. [Question text]</legend>
<sc-for list="{{options}}" as="o" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; border: 1px solid {{o.border}}; background: {{o.bg}}; border-radius: 8px; padding: 0 14px; min-height: 48px">
<sc-if value="{{o.checked}}" hint-placeholder-val="{{ false }}">
<input type="radio" id="{{o.id}}" name="q2" checked="checked" style="width: 18px; height: 18px; margin: 0; accent-color: #0A48A5">
</sc-if>
<sc-if value="{{o.unchecked}}" hint-placeholder-val="{{ true }}">
<input type="radio" id="{{o.id}}" name="q2" style="width: 18px; height: 18px; margin: 0; accent-color: #0A48A5">
</sc-if>
<label for="{{o.id}}" style="flex: 1 1 auto; font-size: 15px; padding: 13px 0">{{o.text}}</label>
</div>
</sc-for>
</fieldset>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px">
<button type="button" style="font: inherit; font-size: 15px; color: #111827; background: #FFFFFF; border: 1px solid #D5D9E0; border-radius: 8px; padding: 11px 18px">Previous</button>
<button type="button" style="font: inherit; font-size: 15px; font-weight: 600; color: #111827; background: #FFFFFF; border: 1px solid #D5D9E0; border-radius: 8px; padding: 11px 18px">Next</button>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #EEF0F3; padding-top: 14px">
<span style="font-size: 13px; color: #4B5563">On the last question, Next gives way to Submit.</span>
<button type="button" style="font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0A48A5; border: 0; border-radius: 8px; padding: 12px 18px">Submit answers</button>
</div>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const plain = { border: '#D5D9E0', bg: '#FFFFFF', checked: false, unchecked: true };
const right = { mark: 'Right', ink: '#067647', bg: '#ECFDF3' };
return {
dots: ['#0A48A5', '#0A48A5', '#E3E6EB', '#E3E6EB', '#E3E6EB'],
options: [
{ ...plain, id: 'q2a', text: '[Answer A]' },
{ id: 'q2b', text: '[Answer B]', border: '#0A48A5', bg: '#E8F0FB', checked: true, unchecked: false },
{ ...plain, id: 'q2c', text: '[Answer C]' },
{ ...plain, id: 'q2d', text: '[Answer D]' }
],
results: [
{ ...right, q: '1. [Question]', detail: 'Your answer: [Answer]' },
{ ...right, q: '2. [Question]', detail: 'Your answer: [Answer]' },
{ q: '3. [Question]', mark: 'Wrong', ink: '#B42318', bg: '#FEF3F2', detail: 'Your answer: [Answer] · correct answer: [Answer]' },
{ ...right, q: '4. [Question]', detail: 'Your answer: [Answer]' },
{ ...right, q: '5. [Question]', detail: 'Your answer: [Answer]' }
]
};
}
}
</script>
</body>
</html>
